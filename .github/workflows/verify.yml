name: verify

# A test nobody runs is not a guard. The stale prices this repository carried
# for weeks would have been caught on the first pull request by the pricing
# check below, had anything been running it.
on:
  pull_request:
  push:
    branches: [preview, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Published prices match the approved catalog
        run: npm run test:pricing
      # assets/masters/*.xlsx is gitignored, so a fresh checkout has no
      # workbooks to personalize. These are the placeholder masters the test
      # was written against, not the real ones.
      - name: Build the placeholder masters
        run: npm run masters
      - name: Workbook personalization
        run: npm run test:personalize
