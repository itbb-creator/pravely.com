name: Verify marketing and platform release

on:
  pull_request:
  # preview and claude/** are here for the same reason main and codex/** are:
  # both assistants push to this repository, and a check that only runs on one
  # of them is a check that half the work skips.
  push:
    branches: [main, preview, "codex/**", "claude/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Scan tracked files for common live-secret formats
        shell: bash
        run: |
          if git grep -IlE '(sk_live_[A-Za-z0-9]{16,}|rk_live_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}|sk-proj-[A-Za-z0-9_-]{16,}|sk-svcacct-[A-Za-z0-9_-]{16,}|re_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})'; then
            echo 'A secret-shaped value was found in a tracked file.'
            exit 1
          fi
      - name: Published prices match the approved catalog
        run: npm run test:pricing
      # assets/masters/*.xlsx is gitignored, so a fresh checkout has no
      # workbooks to personalize. These are the placeholder masters the test
      # was written against, not the real ones.
      - name: Build the placeholder masters
        run: npm run masters
      - run: npm run test:personalize
      - run: npm run test:public-site
      - run: npm run test:release-hardening
      - run: npm run test:health-coach
      - run: npm run test:repository-core
