# Hosted Auth settings are configured in the Supabase dashboard. These values
# keep local Auth tests aligned with production.
[auth]
site_url = "https://app.pravely.com"
additional_redirect_urls = ["https://app.pravely.com", "https://app.pravely.com/**", "https://pravely.com/account.html", "https://pravely.com/confirmation.html", "https://pravely.com/recovery.html", "https://pravelyapp.netlify.app/**", "https://deploy-preview-1--pravelyapp.netlify.app/**", "http://localhost:4173/account.html", "http://127.0.0.1:4174/confirmation.html", "http://127.0.0.1:4174/recovery.html"]
minimum_password_length = 12

[auth.sessions]
# Require re-authentication after one hour without activity.
inactivity_timeout = "1h"

[auth.captcha]
enabled = true
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.email.template.confirmation]
subject = "Verify your Pravely account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Pravely password"
content_path = "./supabase/templates/recovery.html"

# Public entry points called by the static site or Stripe. Each function applies
# its own authorization/validation in code; none accepts database credentials
# from the browser.
[functions.create-checkout]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.get-download]
verify_jwt = false

[functions.preview-email]
verify_jwt = false

[functions.email-preferences]
verify_jwt = false

[functions.submit-support]
verify_jwt = false

[functions.independent-storage-backup]
# Scheduled calls authenticate with a random token generated inside Postgres
# and stored in Vault; the function verifies its hash before doing any work.
verify_jwt = false

[functions.claim-essentials]
verify_jwt = true

[functions.health-coach]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.create-app-checkout]
verify_jwt = true

[functions.delete-user-data]
enabled = true
verify_jwt = false
import_map = "./functions/delete-user-data/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/delete-user-data/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/delete-user-data/*.html" ]
